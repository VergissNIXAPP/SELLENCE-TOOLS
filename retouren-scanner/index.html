<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0A1022" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SELLENCE RETOURENSCANNER" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>SELLENCE RETOURENSCANNER</title>
  <style>
    html,body{height:100%;margin:0;background:#0A1022;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    .wrap{height:100%;display:grid;place-items:center;padding:24px;text-align:center}
    .card{max-width:560px;width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:22px}
    h1{margin:0 0 10px;font-size:22px}
    p{margin:0 0 16px;opacity:.85;line-height:1.4}
    a.btn{display:inline-block;background:linear-gradient(135deg,#7C3AED,#22D3EE);color:#07121f;text-decoration:none;font-weight:800;padding:12px 16px;border-radius:14px}
    .mini{margin-top:14px;font-size:12px;opacity:.65}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>SELLENCE RETOURENSCANNER</h1>
      <p>Steuerbanderolle scannen → Preis + Kategorie werden automatisch erkannt und ins aktuelle Retouren-Paket übernommen.</p>
      <a class="btn" href="app.html">Starten</a>
      <div class="mini">Offline-fähig (PWA). Daten bleiben lokal auf diesem Gerät.</div>
    </div>
  </div>
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
